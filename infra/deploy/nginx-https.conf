# CEO agent only. Do not replace the main nginx.conf or another site's file.
map $http_upgrade $ceo_agent_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ceo.egiresources.com ceo-stage.egiresources.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/ceo-agent/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ceo-stage.egiresources.com;
    ssl_certificate /etc/letsencrypt/live/ceo-agent-egiresources/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ceo-agent-egiresources/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    error_page 502 503 504 =503 @ceo_unavailable;
    location @ceo_unavailable {
        default_type text/plain;
        return 503 "Ruang Kerja sedang disiapkan.\n";
    }
    location ^~ /internal/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:4311;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ceo_agent_connection_upgrade;
        proxy_buffering off;
        proxy_intercept_errors on;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
}

