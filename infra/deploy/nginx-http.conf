# CEO agent only. Install as /etc/nginx/sites-available/ceo-agent.conf.
server {
    listen 80;
    listen [::]:80;
    server_name ceo.egiresources.com ceo-stage.egiresources.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/ceo-agent/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "Ruang Kerja sedang disiapkan.\n";
    }
}
