name: Uji Ruang Kerja

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Siapkan dan lindungi kredensial pengujian
        run: |
          npm run env:init
          node --env-file=.env --input-type=module <<'JS'
          const keys = ['POSTGRES_PASSWORD', 'DATABASE_APP_PASSWORD', 'DATABASE_ADMIN_URL',
            'DATABASE_URL', 'BETTER_AUTH_SECRET', 'SEED_PASSWORD', 'SMTP_PASSWORD', 'SUPERADMIN_PASSWORD'];
          for (const key of keys) {
            const value = process.env[key];
            if (value) process.stdout.write(`::add-mask::${value}\n`);
          }
          JS
      - run: docker compose up -d --wait db mailpit
      - name: Pasang pgTAP
        run: |
          docker compose exec -T -u root db sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends postgresql-17-pgtap'
          docker compose restart db
          docker compose up -d --wait db
      - run: npm run db:migrate
      - name: Uji kebijakan PostgreSQL dan audit
        run: |
          docker compose exec -T db psql -X -U ruang_kerja_admin -d ruang_kerja \
            -v ON_ERROR_STOP=1 -v app_role=ruang_kerja_app < backend/db/pgtap.sql
      - run: npm run db:seed
      - run: npm run test:backend
      - run: npm run test:frontend
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:tools
      - name: Uji desktop dan mobile
        run: npm run test:e2e

  package:
    needs: checks
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
      image_id: ${{ steps.release.outputs.image_id }}
      sha: ${{ steps.release.outputs.sha }}
      branch: ${{ steps.release.outputs.branch }}
      environment: ${{ steps.release.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verifikasi commit yang sudah lulus CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$BRANCH" == main || "$BRANCH" == develop ]]
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')
          [[ "$latest" == "$SHA" ]] || { echo 'Commit sudah digantikan versi baru; release dilewati.'; exit 0; }
          target=stage
          [[ "$BRANCH" == main ]] && target=prod
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$target-sha-$SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'image=%s\nsha=%s\nbranch=%s\nenvironment=%s\n' "$image" "$SHA" "$BRANCH" "$target" >> "$GITHUB_OUTPUT"
          docker build --label "org.opencontainers.image.revision=$SHA" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$image" .
          bash infra/deploy/smoke.sh "$image"
          echo "image_id=$(docker image inspect "$image" --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker push "$image"

  deploy:
    needs: package
    if: >-
      (needs.package.outputs.environment == 'stage' && vars.STAGE_DEPLOY_ENABLED == 'true') ||
      (needs.package.outputs.environment == 'prod' && vars.PROD_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.package.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.package.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.package.outputs.sha }}
          persist-credentials: false
      - name: Kirim image terverifikasi dan deploy lingkungan
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_USER: ${{ vars.VPS_USER || 'root' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          PUBLIC_APP_URL: ${{ vars.APP_URL }}
          RELEASE_IMAGE: ${{ needs.package.outputs.image }}
          RELEASE_ID: ${{ needs.package.outputs.image_id }}
          RELEASE_SHA: ${{ needs.package.outputs.sha }}
          RELEASE_BRANCH: ${{ needs.package.outputs.branch }}
          RELEASE_ENV: ${{ needs.package.outputs.environment }}
        run: bash infra/deploy/publish.sh
