name: Uji Ruang Kerja

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      vps_readiness:
        description: Periksa VPS secara baca-saja; tanpa build, migrasi, atau deploy
        type: boolean
        default: false
      inspect_ingress:
        description: Tambahkan inspeksi proxy/HTTPS baca-saja pada pemeriksaan VPS
        type: boolean
        default: false
      repair_stage_gateway:
        description: Perbaikan terencana Host gateway stage; memerlukan nol sesi suara
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || (!inputs.vps_readiness && !inputs.repair_stage_gateway)
    concurrency:
      group: checks-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Validasi alur PR
        if: github.event_name == 'pull_request'
        run: node scripts/branch-policy.mjs pull-request
      - run: npm ci --no-audit --no-fund
      - name: Siapkan dan lindungi kredensial pengujian
        run: |
          npm run env:init
          node --env-file=.env --input-type=module <<'JS'
          const keys = ['POSTGRES_PASSWORD', 'DATABASE_APP_PASSWORD', 'DATABASE_ADMIN_URL',
            'DATABASE_URL', 'BETTER_AUTH_SECRET', 'SEED_PASSWORD', 'SMTP_PASSWORD', 'SUPERADMIN_PASSWORD'];
          for (const key of keys) {
            const value = process.env[key];
            if (value) process.stdout.write(`::add-mask::${value}\n`);
          }
          JS
      - run: docker compose up -d --wait db mailpit
      - name: Pasang pgTAP
        run: |
          docker compose exec -T -u root db sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends postgresql-17-pgtap'
          docker compose restart db
          docker compose up -d --wait db
      - run: npm run db:migrate
      - name: Uji kebijakan PostgreSQL dan audit
        run: |
          docker compose exec -T db psql -X -U ruang_kerja_admin -d ruang_kerja \
            -v ON_ERROR_STOP=1 -v app_role=ruang_kerja_app < backend/db/pgtap.sql
      - run: npm run db:seed
      - run: npm run test:backend
      - run: npm run test:frontend
      - run: npm run build
      - run: npm run build:server
      - run: npm run test:deployment
      - name: Simpan hasil build untuk image release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-${{ github.sha }}
          path: |
            build/
            frontend/dist/
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  package:
    concurrency:
      group: package-${{ github.ref }}
      cancel-in-progress: true
    needs: checks
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      pull-requests: read
    outputs:
      image: ${{ steps.release.outputs.image }}
      image_id: ${{ steps.image.outputs.image_id }}
      sha: ${{ steps.release.outputs.sha }}
      branch: ${{ steps.release.outputs.branch }}
      environment: ${{ steps.release.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verifikasi commit yang sudah lulus CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$BRANCH" == main || "$BRANCH" == develop ]]
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" > "$RUNNER_TEMP/release-prs.json"
          GITHUB_EVENT_PATH="$RUNNER_TEMP/release-prs.json" node scripts/branch-policy.mjs release
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')
          [[ "$latest" == "$SHA" ]] || { echo 'Commit sudah digantikan versi baru; release dilewati.'; exit 0; }
          target=stage
          [[ "$BRANCH" == main ]] && target=prod
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$target-sha-$SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'image=%s\nsha=%s\nbranch=%s\nenvironment=%s\n' "$image" "$SHA" "$BRANCH" "$target" >> "$GITHUB_OUTPUT"
      - name: Ambil hasil build yang sudah diperiksa
        if: steps.release.outputs.image != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build-${{ github.sha }}
          path: .
      - name: Bangun dan terbitkan image runtime
        if: steps.release.outputs.image != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.release.outputs.sha }}
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
        id: image
        run: |
          set -euo pipefail
          image="$RELEASE_IMAGE"
          docker build --label "org.opencontainers.image.revision=$SHA" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$image" .
          bash infra/deploy/smoke.sh "$image"
          echo "image_id=$(docker image inspect "$image" --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker push "$image"

  deploy:
    needs: package
    if: >-
      needs.package.outputs.environment == 'stage' || needs.package.outputs.environment == 'prod'
    runs-on: [self-hosted, Linux, X64, ceo-agent-deploy]
    timeout-minutes: 20
    environment: ${{ needs.package.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.package.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.package.outputs.sha }}
          persist-credentials: false
      - name: Jalankan image terverifikasi pada VPS
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_APP_URL: ${{ vars.APP_URL }}
          RELEASE_IMAGE: ${{ needs.package.outputs.image }}
          RELEASE_IMAGE_ID: ${{ needs.package.outputs.image_id }}
          RELEASE_ID: ${{ needs.package.outputs.sha }}
          RELEASE_BRANCH: ${{ needs.package.outputs.branch }}
          RELEASE_ENV: ${{ needs.package.outputs.environment }}
        run: bash infra/deploy/publish.sh

  vps-readiness:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.vps_readiness &&
      github.repository == 'DonnyRZ/ceo-voice-agent' &&
      (github.ref_name == 'develop' || github.ref_name == 'main')
    runs-on: [self-hosted, Linux, X64, ceo-agent-deploy]
    timeout-minutes: 3
    environment: ${{ github.ref_name == 'main' && 'prod' || 'stage' }}
    concurrency:
      group: deploy-${{ github.ref_name == 'main' && 'prod' || 'stage' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Periksa konfigurasi dan koneksi tanpa mengubah layanan
        env:
          DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'stage' }}
        run: bash infra/deploy/readiness.sh
      - name: Periksa pemetaan domain dan proxy tanpa mengubah layanan
        if: inputs.inspect_ingress
        run: python3 infra/deploy/inspect-ingress.py

  repair-stage-gateway:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.repair_stage_gateway &&
      github.repository == 'DonnyRZ/ceo-voice-agent' && github.ref_name == 'develop'
    runs-on: [self-hosted, Linux, X64, ceo-agent-deploy]
    timeout-minutes: 3
    environment: stage
    concurrency:
      group: deploy-stage
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Perbaiki gateway stage tanpa menyentuh Nginx atau PostgreSQL
        env:
          PUBLIC_APP_URL: ${{ vars.APP_URL }}
        run: bash infra/deploy/repair-stage-gateway.sh
