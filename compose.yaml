services:
  db:
    image: pgvector/pgvector:pg17-trixie
    environment:
      POSTGRES_DB: ruang_kerja
      POSTGRES_USER: ruang_kerja_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run env:init}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?Run npm run env:init}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5441}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruang_kerja_admin -d ruang_kerja"]
      interval: 2s
      timeout: 3s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.34.0
    environment:
      MP_MAX_MESSAGES: 100
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
